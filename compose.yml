services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DATABASE__NAME:-qualifyze}
      POSTGRES_USER: ${DATABASE__USERNAME:-qualifyze}
      POSTGRES_PASSWORD: ${DATABASE__PASSWORD:?DATABASE__PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U qualifyze -d qualifyze" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
